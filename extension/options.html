<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>B站视频 AI 助手 · 设置</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>B站视频 AI 助手</h1>
    <p>模型密钥由本地 Agent 服务从项目 <code>.env</code> 读取，插件不保存或接收 provider 密钥。</p>
    <h2>启动本地服务</h2>
    <pre>npm run agent:dev</pre>
    <p class="hint">启动后回到 B站视频页，在侧栏点击“开始分析”。服务只监听本机地址，处理结果仍显示在插件侧栏。</p>
    <p id="status" role="status">当前配置方式：本地 Agent .env</p>
  </main>
</body>
</html>
